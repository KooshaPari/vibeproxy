[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeproxy-exporter"
version = "0.1.0"
description = "Export vibeproxy.monitoring.v1 JSON from Prometheus /metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Koosha Pari" }]
dependencies = []

[project.scripts]
vibeproxy-export = "exporter.cli:main"

[tool.setuptools.packages.find]
include = ["exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
