name: CI

on:
  push:
    branches: [main, feature/*, bugfix/*, docs/*, release/*, hotfix/*, feat/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1

      - uses: actions/setup-python@0a5c61591373683505ea898e64f0ed662ac8d3e1 # v5.0.0
        with:
          python-version: "3.12"

      - name: Exporter smoke tests
        run: python -m unittest discover -s tests -v

  phenotype-validate:
    uses: KooshaPari/phenotypeActions/.github/workflows/validate-governance.yml@main
